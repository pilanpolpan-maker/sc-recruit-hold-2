plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'   // ถ้า resolve ไม่ได้ ให้ใช้เวอร์ชัน 2.0.x ล่าสุด
}

version = mod_version
base { archivesName = 'recruits-scorch-pose' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = '21.1.228'
    runs { client { client() } }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

// ไม่ต้องใส่ jar ของ Recruits/Scorched Guns เป็น dependency:
// โค้ดแอดออนอ้าง class ของสองมอดนี้ด้วยชื่อ string เท่านั้น
processResources {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: mod_version) }
}
